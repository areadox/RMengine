# Baut RMengine für Windows und Linux und veröffentlicht ein Release.
#
# Zwei Möglichkeiten:
#  1. Auf GitHub: Actions → "Release" → "Run workflow" (nimmt die Version aus Cargo.toml)
#  2. Ein Tag hochladen, z.B.  git tag v0.2.0 && git push origin v0.2.0
#     (das Tag muss zur Version in Cargo.toml passen)

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      neuerungen:
        description: "Was ist neu? (erscheint im Release und beim Update)"
        required: false
        default: ""

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux (x86_64)
    # 22.04, damit der Welteditor auch auf älteren Distributionen läuft (glibc 2.35).
    # Der Server selbst wird statisch (musl) gebaut und läuft überall.
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Version prüfen
        id: version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zur Version $VERSION in Cargo.toml"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: musl installieren
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Server bauen (statisch)
        run: cargo build --release --locked --target x86_64-unknown-linux-musl

      - name: Welteditor bauen
        run: cargo build --release --locked -p rmeditor

      - name: Beispielwelt prüfen
        run: ./target/x86_64-unknown-linux-musl/release/rmengine daten --pruefen

      - name: Paket bauen
        run: |
          BIN=target/x86_64-unknown-linux-musl/release/rmengine
          EDITOR=target/release/rmeditor
          mkdir -p dist/rmengine
          cp "$BIN" "$EDITOR" dist/rmengine/
          cp -r daten ANLEITUNG.md README.md installer/linux/installieren.sh installer/linux/deinstallieren.sh dist/rmengine/
          chmod +x dist/rmengine/rmengine dist/rmengine/rmeditor dist/rmengine/*.sh
          tar -czf dist/rmengine-linux-x86_64.tar.gz -C dist rmengine
          cp "$BIN" dist/rmengine-linux-x86_64
          cp "$EDITOR" dist/rmeditor-linux-x86_64
          cp installer/linux/install.sh dist/install.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/rmengine-linux-x86_64.tar.gz
            dist/rmengine-linux-x86_64
            dist/rmeditor-linux-x86_64
            dist/install.sh

  windows:
    name: Windows (x86_64)
    runs-on: windows-latest
    env:
      # Ohne Visual-C++-Laufzeit lauffähig
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Bauen
        run: cargo build --release --locked -p rmengine -p rmeditor

      - name: Beispielwelt prüfen
        shell: cmd
        run: target\release\rmengine.exe daten --pruefen < NUL

      - name: Inno Setup installieren
        run: choco install innosetup -y --no-progress

      - name: Installer bauen
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist\windows | Out-Null
          Copy-Item target\release\rmengine.exe dist\windows\rmengine.exe
          Copy-Item target\release\rmeditor.exe dist\windows\rmeditor.exe
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" installer\windows\rmengine.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target\release\rmengine.exe dist\rmengine-windows-x86_64.exe
          Copy-Item target\release\rmeditor.exe dist\rmeditor-windows-x86_64.exe
          # Portable Version als ZIP (ohne Installation)
          New-Item -ItemType Directory -Force dist\portable\RMengine | Out-Null
          Copy-Item target\release\rmengine.exe, target\release\rmeditor.exe, ANLEITUNG.md, README.md dist\portable\RMengine\
          Copy-Item -Recurse daten dist\portable\RMengine\daten
          Compress-Archive -Path dist\portable\RMengine -DestinationPath dist\RMengine-windows-x86_64-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/RMengine-Setup-*.exe
            dist/rmengine-windows-x86_64.exe
            dist/rmeditor-windows-x86_64.exe
            dist/RMengine-windows-x86_64-portable.zip

  release:
    name: Release veröffentlichen
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release-Text
        env:
          NEUERUNGEN: ${{ github.event.inputs.neuerungen }}
        run: |
          if [ -n "$NEUERUNGEN" ]; then
            printf '## Was ist neu?\n\n%s\n\n' "$NEUERUNGEN" > notizen.md
          fi
          cat >> notizen.md <<'TEXT'
          ## Installation

          **Windows:** `RMengine-Setup-….exe` herunterladen und ausführen. Installiert wird ohne Administratorrechte nach *Dokumente\RMengine*.
          Im Startmenü gibt es den Server und den **Welteditor**.
          Ohne Installation: `RMengine-windows-x86_64-portable.zip` entpacken und `rmengine.exe` (Server) oder `rmeditor.exe` (Welteditor) starten.

          **Linux:**
          ```bash
          curl -fsSL https://github.com/areadox/RMengine/releases/latest/download/install.sh | bash
          ```
          oder `rmengine-linux-x86_64.tar.gz` entpacken und `rmengine/installieren.sh` ausführen.
          Danach: `rmengine` startet den Server, `rmeditor` den Welteditor (braucht eine grafische Oberfläche).

          ## Aktualisieren

          `rmengine --update` (unter Windows im Startmenü: *RMengine → Nach Updates suchen*). Der Welteditor wird dabei mit aktualisiert.
          Deine Weltdaten und Spielstände werden dabei nicht verändert.
          TEXT

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.linux.outputs.version }}
          name: RMengine ${{ needs.linux.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notizen.md
          generate_release_notes: true
          files: |
            dist/*
            ANLEITUNG.md
