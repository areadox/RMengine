[package]
name = "rmeditor"
version = "0.2.1"
edition = "2021"
description = "Grafischer Welteditor für RMengine: Räume auf einer Karte bauen, verbinden und beschreiben."
repository = "https://github.com/areadox/RMengine"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
toml_edit = "0.25"

