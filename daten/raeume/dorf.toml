[[raum]]
id       = "kraemerladen"
name     = "Der Krämerladen"
symbol   = "L"
x = -1
y = 1
gebiet   = "dorf"
gelaende = "haus"
beschreibung = """
Ein enger Laden, vollgestopft bis unter die Decke: Seile, Kerzen, Töpfe,
Säcke mit Mehl. Hinter dem Tresen wartet die Krämerin."""
ausgaenge = { ost = "hauptstrasse" }
npcs   = ["kraemerin"]

[[raum]]
id       = "gartentor"
name     = "Vor dem Kräutergarten"
symbol   = "G"
x = -1
y = -1
gebiet   = "dorf"
gelaende = "garten"
beschreibung = """
Eine niedrige Hecke umschließt einen Garten. Ein kleines, grün gestrichenes
Tor steht offen – du könntest hineingehen."""
ausgaenge = { nordost = "dorfplatz", rein = "kraeutergarten" }
deko_richtung = { sued = "~" }

