# =====================================================================
#  Das Dorf Eichenhain
# =====================================================================
#  symbol: Buchstabe im Kästchen auf der Karte, z.B. K = Kneipe, T = Tempel
#  Koordinaten: x wird nach OSTEN größer, y nach NORDEN, z nach OBEN.
#  Ausgänge: nord, nordost, ost, suedost, sued, suedwest, west, nordwest, hoch, runter
#  Der Rückweg wird automatisch angelegt (siehe welt.toml).

[[raum]]
id       = "dorfplatz"
name     = "Der Dorfplatz"
x = 0
y = 0
gebiet   = "dorf"
gelaende = "platz"
beschreibung = """
Du stehst auf dem kopfsteingepflasterten Dorfplatz von Eichenhain. In der
Mitte plätschert ein alter {hellblau}Brunnen{/}. Im Osten hängt das Schild
einer Taverne, im Westen hörst du Hammerschläge. Eine Straße führt nach
Norden, im Süden erhebt sich ein kleiner Tempel."""
beschreibung_nacht = """
Der Dorfplatz liegt still im Mondlicht. Der {hellblau}Brunnen{/} plätschert leise,
aus den Fenstern der Taverne im Osten fällt warmes Licht. Die Straße nach
Norden und der Tempel im Süden sind nur als dunkle Umrisse zu erkennen."""
ausgaenge = { nord = "hauptstrasse", ost = "taverne", west = "schmiede", sued = "tempel", nordost = "marktstand" }
gegenstaende = ["apfel"]

nutzt     = ["brunnen", "linde"]   # allgemeine Beschreibungen aus daten/beschreibungen
geruch    = "Es riecht nach frischem Brot aus der Taverne und nach Rauch."
geraeusch = "Der Brunnen plätschert, irgendwo gackern Hühner."

# Ein SEHR ausführliches Detail: eigener Text, Sinne und Unterdetails.
# Es ersetzt hier den allgemeinen Brunnen aus der Bibliothek.
[raum.details.brunnen]
text      = """
Der Brunnen von Eichenhain ist älter als jedes Haus im Dorf. Seine
Einfassung aus grauem Stein ist hüfthoch und von unzähligen Händen glatt
gerieben. Über dem Schacht spannt sich ein hölzernes Dach mit einer Winde,
von der ein Seil mit einem Eimer in die Tiefe führt. In den {fett}Rand{/}
hat jemand etwas eingeritzt."""
woerter   = ["dorfbrunnen", "schacht"]
geraeusch = "Tief unten plätschert Wasser. Wenn du hineinrufst, antwortet ein dumpfes Echo."
gefuehl   = "Die Steine sind kühl und an der Innenseite feucht und glitschig."
nutzt     = ["wasser"]

[raum.details.brunnen.details.rand]
text    = "In den Stein ist geritzt: 'Erbaut im Jahre 312'. Darunter, kleiner und krakelig: 'Lina + Jorn'."
woerter = ["inschrift", "einritzung", "jahreszahl"]
gefuehl = "Mit dem Finger kannst du die Buchstaben nachfahren."

[raum.details.brunnen.details.eimer]
text   = "Ein alter Holzeimer an einer rostigen Kette. Am Boden steht noch etwas Wasser."
geruch = "Der Eimer riecht modrig nach Brunnenwasser."

[raum.details]
schild = "Auf dem Schild steht: 'Zum Goldenen Eber'."

[[raum]]
id       = "hauptstrasse"
name     = "Die Hauptstraße"
x = 0
y = 1
gebiet   = "dorf"
gelaende = "strasse"
beschreibung = """
Eine staubige Straße zwischen schiefen Fachwerkhäusern. Im Norden siehst du
das Dorftor, im Süden den Dorfplatz."""
ausgaenge = { nord = "nordtor" }

[[raum]]
id       = "marktstand"
name     = "Ein Marktstand"
symbol   = "M"
x = 1
y = 1
gebiet   = "dorf"
gelaende = "strasse"
beschreibung = """
Ein bunter Marktstand mit Körben voller Obst und Gemüse. Die Händlerin ist
gerade nicht da."""
gegenstaende = ["apfel", "apfel"]
ausgaenge = { ost = "osttor" }

[[raum]]
id       = "nordtor"
name     = "Das Nordtor"
x = 0
y = 2
gebiet   = "dorf"
gelaende = "haus"
beschreibung = """
Ein hölzernes Tor in der niedrigen Palisade des Dorfes. Dahinter beginnt
der {gruen}Dunkelwald{/}."""
ausgaenge = { nord = "waldrand" }
npcs      = ["hauptmann"]

[[raum]]
id       = "taverne"
name     = "Taverne 'Zum Goldenen Eber'"
symbol   = "K"
x = 1
y = 0
gebiet   = "dorf"
gelaende = "haus"
beschreibung = """
Eine gemütliche, verrauchte Gaststube. Ein Feuer knistert im Kamin. Eine
knarrende Treppe führt nach oben, eine Falltür nach unten in den Keller."""
ausgaenge = { hoch = "gaestezimmer", runter = "keller" }
npcs   = ["wirt"]
nutzt     = ["theke", "fass", "feuer", "tisch", "stuhl", "bank", "treppe"]
geruch    = "Es riecht nach Bier, Bratenfett und Holzrauch."
geraeusch = "Das Feuer knistert, Krüge klappern."

[[raum]]
id       = "gaestezimmer"
name     = "Ein Gästezimmer"
symbol   = "Z"
x = 1
y = 0
z = 1
gebiet   = "dorf"
gelaende = "haus"
beschreibung = "Ein kleines Zimmer mit einem Bett und einer Truhe."
nutzt    = ["bett", "truhe"]
gegenstaende = ["heiltrank"]

[[raum]]
id       = "keller"
name     = "Der Weinkeller"
x = 1
y = 0
z = -1
gebiet   = "keller"
gelaende = "hoehle"
beschreibung = """
Feucht und dunkel. Zwischen den Weinfässern raschelt es verdächtig. Ein
enger Gang führt weiter nach Osten."""
ausgaenge = { ost = "kellergang" }
monster   = ["ratte"]
nutzt     = ["fass", "spinnweben"]
geruch    = "Es riecht nach saurem Wein und Mäusedreck."

[[raum]]
id       = "kellergang"
name     = "Ein enger Kellergang"
x = 2
y = 0
z = -1
gebiet   = "keller"
gelaende = "hoehle"
beschreibung = "Ein niedriger Gang. Hier ist es so eng, dass du dich bücken musst."
monster   = ["ratte"]

[[raum]]
id       = "schmiede"
name     = "Die Schmiede"
symbol   = "S"
x = -1
y = 0
gebiet   = "dorf"
gelaende = "haus"
beschreibung = """
Hitze schlägt dir entgegen. An der Esse arbeitet ein muskulöser Schmied.
An den Wänden hängen Werkzeuge und ein paar einfache Waffen."""
npcs      = ["schmied"]
gegenstaende = ["kurzschwert", "dolch", "streitaxt", "holzschild", "amboss"]
nutzt        = ["feuer"]
geruch       = "Es riecht nach heißem Eisen, Kohle und Schweiß."
geraeusch    = "Der Hammer klingt hell auf dem Amboss, das Feuer faucht im Blasebalg."

[[raum]]
id       = "tempel"
name     = "Der kleine Tempel"
symbol   = "T"
x = 0
y = -1
gebiet   = "dorf"
gelaende = "tempel"
beschreibung = """
Ein stiller Raum aus weißem Stein. Durch ein buntes Glasfenster fällt
farbiges Licht auf einen schlichten Altar."""
gegenstaende = ["manatrank"]
npcs         = ["priesterin"]
deko_richtung = { sued = "~", suedost = "~", suedwest = "~" }   # der Dorfbach

[raum.details]
altar   = "Auf dem Altar liegen frische Blumen."
fenster = "Das Fenster zeigt eine Eiche unter einem goldenen Sonnenaufgang."

[[raum]]
id       = "osttor"
name     = "Das Osttor"
symbol   = "E"
x = 2
y = 1
gebiet   = "dorf"
gelaende = "haus"
beschreibung = """
Ein gedrungenes Tor aus Bruchstein. Draußen beginnt die Landstraße, die
hinaus ins weite Land führt."""
# Der Ausgang "raus" auf die Oberwelt entsteht automatisch (siehe oberwelt/oberwelt.toml).

