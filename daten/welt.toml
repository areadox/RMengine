# =====================================================================
#  welt.toml – die Grundeinstellungen deiner Welt
# =====================================================================
#  Alles, was mit # beginnt, ist ein Kommentar und wird ignoriert.

[welt]
name       = "Eichenhain"
port       = 4000                 # Mit diesem Port verbinden sich die Spieler
startraum  = "dorfplatz"          # Hier beginnen neue Spieler
willkommen = """
Willkommen im kleinen Dorf {gruen}Eichenhain{/} am Rande des Dunkelwaldes.
Hier beginnt dein Abenteuer."""

# Rollen: Spieler < Baumeister (baut die Welt) < Admin (verwaltet alles).
# Wer hier steht, hat MINDESTENS diese Rolle. Weitere Rollen vergibt ein
# Admin im Spiel mit:  rolle <name> spieler|baumeister|admin
# WICHTIG: Trag hier deinen eigenen Figurennamen ein und lege die Figur sofort an!
admins     = ["Admin"]
baumeister = []

karte_beim_umsehen  = true        # Bei jedem "schau" die kleine Karte zeigen
karten_radius       = 1           # Räume in jede Richtung (1 = 3x3 Räume; "karte" zeigt mehr)
stadtkarte_stil     = "kasten"    # "kasten" = ( ) und [ ] im Rahmen, "linien" = ein Zeichen pro Raum
karten_hintergrund  = "*"         # Füllzeichen für leere Stellen
nur_besuchte_raeume_auf_karte = false   # true = "Nebel des Krieges"
ausgaenge_beidseitig = true       # Rückwege automatisch anlegen

takt_sekunden          = 3        # Alle 3 Sekunden "lebt" die Welt (Monster laufen ...)
zuruecksetzen_minuten  = 10       # Dann werden Gegenstände/Monster wieder aufgefüllt
speichern_minuten      = 5        # Automatisches Speichern
regeneration_lp        = 1        # Erholung pro Takt
regeneration_mp        = 1

# ---------------------------------------------------------------------
# Damit beginnen neue Spieler
# ---------------------------------------------------------------------
[start]
lebenspunkte = 100
mana         = 50
gegenstaende = ["brot", "fackel", "landkarte"]
zauber       = ["kleine_heilung", "heimkehr", "feuerpfeil"]

[start.fertigkeiten]       # Fertigkeit = Stufe
magie        = 1
heilkunde    = 1
schwertkampf = 1

[start.werte]              # Frei wählbare Grundwerte
staerke      = 10
geschick     = 10
ausdauer     = 10
intelligenz  = 10
weisheit     = 10

# ---------------------------------------------------------------------
# Kampf: Echtzeit, keine Runden. Jeder Angriff hat eine Erholungszeit.
# Alle Zeiten in Sekunden (Kommazahlen erlaubt, z.B. 2.5).
# ---------------------------------------------------------------------
[kampf]
auto_angriff        = true    # nach "toete ratte" geht der Kampf von selbst weiter
waffenlos_schaden   = 2       # Schaden ohne Waffe
waffenlos_erholung  = 2.5     # Sekunden zwischen zwei Faustschlägen
zauber_erholung     = 2.0     # Sekunden nach einem Kampfzauber
ausdauer            = 100     # Ausdauer zu Beginn (jeder Angriff kostet etwas)
ausdauer_pro_angriff = 5
ausdauer_erholung   = 3       # pro Takt

# Stufen: Für die nächste Stufe braucht man  ep_basis * stufe ^ ep_faktor
# Erfahrungspunkte (Stufe 1: 100, Stufe 2: 283, Stufe 3: 520, ...)
ep_basis            = 100
ep_faktor           = 1.5
lp_pro_stufe        = 10      # so viel mehr Lebenspunkte pro Stufe
mp_pro_stufe        = 5
ausdauer_pro_stufe  = 5
punkte_pro_stufe    = 2       # zum Verteilen mit "steigere staerke" usw.

# Tod: Man bleibt liegen und kann von anderen wiederbelebt werden.
# Nach der Wartezeit (oder mit "aufgeben") erwacht man im Wiederbelebungsraum.
wiederbelebung_raum       = "tempel"
tod_wartezeit             = 300   # Sekunden (= 5 Minuten)
wiederbelebung_lp_prozent = 50    # so viele Lebenspunkte hat man danach
tod_ep_verlust_prozent    = 0     # Verlust an Erfahrung (0 = keiner)
tod_gegenstaende          = "behalten"   # oder "fallen_lassen"

monster_erholung_prozent  = 5     # Monster heilen sich außerhalb des Kampfes

# ---------------------------------------------------------------------
# Anzeigenamen: IDs dürfen keine Umlaute haben, hier stehen die schönen
# Namen für Werte, Ausrüstungsplätze und Eigenschaften.
# ---------------------------------------------------------------------
[namen]
staerke     = "Stärke"
geschick    = "Geschick"
ausdauer    = "Ausdauer"
intelligenz = "Intelligenz"
weisheit    = "Weisheit"
waffe       = "Waffe"
schild      = "Schild"
kopf        = "Kopf"
koerper     = "Körper"
haende      = "Hände"
beine       = "Beine"
fuesse      = "Füße"
hals        = "Hals"
umhang      = "Umhang"
licht       = "Licht"
schaden     = "Schaden"
ruestung    = "Rüstung"

# ---------------------------------------------------------------------
# Geländearten: So sehen Räume auf der Karte aus
# klammern: Kästchen auf der Stadtkarte, z.B. "()" draußen, "[]" Gebäude
# nutzt:    allgemeine Beschreibungen aus daten/beschreibungen (für alle Räume dieser Art)
# geruch / geraeusch / gefuehl: was man mit riech / hoer / taste wahrnimmt
# symbol:   nur für den Stil "linien" (im Kästchen steht das symbol des Raums)
# Farben: rot gruen gelb blau magenta cyan weiss grau schwarz
#         hellrot hellgruen hellgelb hellblau hellmagenta hellcyan hellweiss
# ---------------------------------------------------------------------
[gelaende.platz]
name   = "Platz"
symbol = "+"
farbe  = "hellgelb"
klammern = "()"
nutzt    = ["pflaster", "himmel", "luft"]
geruch   = "Es riecht nach Rauch aus den Schornsteinen."
geraeusch = "Stimmen, Schritte und das Gackern von Hühnern."

[gelaende.strasse]
name   = "Straße"
symbol = "."
farbe  = "weiss"
klammern = "()"
nutzt    = ["pflaster", "himmel", "staub", "dach", "schornstein"]
geraeusch = "Irgendwo bellt ein Hund."

[gelaende.haus]
name   = "Gebäude"
symbol = "#"
farbe  = "hellweiss"
klammern = "[]"
nutzt    = ["wand", "dielen", "decke", "tuer", "fenster", "balken"]

[gelaende.tempel]
name   = "Tempel"
symbol = "T"
farbe  = "hellcyan"
klammern = "[]"
nutzt    = ["mauer", "fenster", "kerze"]
geruch   = "Ein Hauch von Weihrauch hängt in der Luft."
geraeusch = "Es ist so still, dass du deinen eigenen Atem hörst."

[gelaende.wald]
name   = "Wald"
symbol = "♣"
farbe  = "gruen"
klammern = "{}"
deko     = "o&"          # Bäume rund um Waldräume
deko_dichte = 60
nutzt    = ["baum", "eiche", "buche", "moos", "farn", "laub", "erde", "pilze", "voegel"]
geruch   = "Es riecht nach feuchtem Laub, Moos und Pilzen."
geraeusch = "Vögel zwitschern, und irgendwo knackt ein Ast."

[gelaende.lichtung]
name   = "Wiese"
symbol = "\""
farbe  = "hellgruen"
klammern = "()"
deko     = "o"
deko_dichte = 25
nutzt    = ["gras", "blumen", "himmel", "insekten", "baum"]
geruch   = "Süßer Blütenduft liegt in der Luft."
geraeusch = "Bienen summen zwischen den Blumen."

[gelaende.garten]
name     = "Garten"
symbol   = "%"
farbe    = "hellgruen"
klammern = "()"
deko     = "o&"            # verstreute Bäume und Büsche
deko_dichte = 45           # Prozent der freien Stellen rund um den Raum
nutzt    = ["gras", "blumen", "kraeuter", "hecke", "insekten", "apfelbaum"]
geruch   = "Es duftet nach Kräutern und Blüten."
geraeusch = "Bienen summen geschäftig."

[gelaende.wasser]
name   = "Wasser"
symbol = "~"
farbe  = "hellblau"
klammern = "()"
nutzt    = ["wasser", "ufer", "schilf", "himmel"]
geruch   = "Es riecht nach Wasser und Schilf."
geraeusch = "Wasser plätschert leise."

[gelaende.berg]
name   = "Fels"
symbol = "^"
farbe  = "grau"
klammern = "<>"
nutzt    = ["fels", "steine", "wind", "himmel"]
geraeusch = "Der Wind pfeift um die Felsen."

[gelaende.hoehle]
name   = "Höhle"
symbol = "o"
farbe  = "grau"
klammern = "<>"
nutzt    = ["fels", "steine", "spinnweben"]
geruch   = "Es riecht feucht und muffig."
geraeusch = "Wasser tropft irgendwo von der Decke."
gefuehl  = "Die Wände sind feucht und kalt."

# ---------------------------------------------------------------------
# Farben der Verzierungen auf der Stadtkarte (Zeichen = Farbe)
# Verzierungen setzt man bei Geländearten oder Räumen mit
#   deko = "o&"                  verstreut um das Kästchen
#   deko_richtung = { sued = "~" }  eine ganze Seite, z.B. ein Bach
# ---------------------------------------------------------------------
[deko]
"o" = "gruen"
"&" = "hellgruen"
"~" = "hellblau"
"^" = "grau"

# ---------------------------------------------------------------------
# Angaben für MUD-Verzeichnisse (MSSP). Name, Spielerzahl, Laufzeit usw.
# schickt der Server selbst – hier kannst du Weiteres ergänzen oder
# überschreiben. Alles freiwillig.
# ---------------------------------------------------------------------
[mssp]
GENRE    = "Fantasy"
GAMEPLAY = "Adventure"
STATUS   = "Alpha"
