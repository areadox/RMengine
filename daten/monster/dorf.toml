# =====================================================================
#  Tiere und Monster (NPCs mit Gesprächen stehen in daten/npcs/)
# =====================================================================
#  name:     kurzer Name im Satz ("eine Ratte")
#  akkusativ: Name nach "auf ..." (z.B. "einen grauen Wolf"), optional
#  raumtext: wie das Monster im Raum beschrieben wird (optional)
#  wandert:  läuft herum (bleibt aber im Gebiet seines Startraums)
#  sprueche: zufällige Sätze. Beginnt ein Spruch mit *, ist es eine Handlung.
#  beute:    was es beim Tod fallen lässt (chance in Prozent)
#
#  Kampf:
#    aggressiv  = true          greift Spieler von selbst an
#    schaden    = 4             Grundschaden (ohne Angabe: 2 + 2 * stufe)
#    ruestung   = 1             zieht so viel von jedem Treffer ab
#    erholung   = 3.0           Sekunden zwischen zwei Angriffen
#    angriffe   = ["beißt", "kratzt"]   "Die Ratte beißt dich."
#    erfahrung  = 20            Erfahrung für den Sieg (sonst automatisch)
#    todestext  = "*fiept ein letztes Mal."
#    angreifbar = false         kann nicht angegriffen werden (NPCs: Standard)

[[monster]]
id   = "ratte"
erbt = "vorlage_raubtier"
name = "eine fette Ratte"
schluesselwoerter = ["ratte"]
beschreibung = "Eine Ratte, so groß wie eine Katze, mit gelben Zähnen."
stufe = 1
lebenspunkte = 8
wander_chance = 15
sprueche = ["*fiept.", "*nagt an einem Fass."]
beute = [ { gegenstand = "rattenschwanz", chance = 50 } ]
geld  = [1, 3]          # Gold beim Sieg: eine Zahl oder [von, bis]
erholung  = 2.5
angriffe  = ["beißt", "kratzt"]
todestext = "*fiept ein letztes Mal und bleibt reglos liegen."

