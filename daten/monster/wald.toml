[[monster]]
id   = "eichhoernchen"
name = "ein Eichhörnchen"
schluesselwoerter = ["eichhoernchen", "hoernchen"]
beschreibung = "Ein kleines, rotes Eichhörnchen mit buschigem Schwanz."
lebenspunkte = 3
wandert = true
wander_chance = 20
sprueche = ["*knabbert an einer Nuss.", "*huscht einen Baum hinauf und wieder herunter."]
angreifbar = false

[[monster]]
id   = "wolf"
erbt = "vorlage_raubtier"
koerper = "wolf"
name = "ein grauer Wolf"
akkusativ = "einen grauen Wolf"
schluesselwoerter = ["wolf"]
raumtext = "Ein grauer Wolf schleicht knurrend zwischen den Bäumen umher."
beschreibung = "Ein magerer Wolf mit struppigem Fell und hungrigen Augen."
stufe = 3
lebenspunkte = 30
werte = { staerke = 12, geschick = 14 }
wander_chance = 8
sprueche = ["*heult.", "*fletscht die Zähne."]
beute = [ { gegenstand = "wolfspelz", chance = 75 } ]
geld  = [30, 80]
erholung  = 2.8
angriffe  = ["beißt", "reißt mit den Zähnen an", "springt"]
todestext = "*jault auf und bricht zusammen."
geruch = "Der Wolf riecht nach nassem Fell und Blut."
geraeusch = "Ein tiefes Knurren dringt aus seiner Kehle."

[monster.details]
augen  = "Gelbe Augen, die dich nicht eine Sekunde loslassen."
zaehne = { text = "Lange, gelbliche Reißzähne.", woerter = ["gebiss", "fang"] }

[monster.leiche]
name      = "der Kadaver eines Wolfs"
dativ     = "dem Kadaver eines Wolfs"
bodentext = "Der Kadaver eines grauen Wolfs liegt im Laub."
beschreibung = "Der Wolf liegt ausgestreckt da, die gelben Augen sind gebrochen. Sein struppiges Fell ist blutverklebt."
geruch    = "Nasses Fell und Blut."
gefuehl   = "Das Fell ist rau und noch ein wenig warm."
verwest   = "Vom Wolf bleiben nur ein paar Knochen, die bald unter dem Laub verschwinden."

[monster.leiche.details.fell]
text    = "Grau, struppig und an der Flanke aufgerissen. Ein Kürschner könnte daraus noch etwas machen."
woerter = ["pelz", "flanke"]
gefuehl = "Rau und borstig."

[monster.leiche.details.fell.details.wunde]
text = "Eine tiefe Wunde – hier hat dein letzter Hieb getroffen."

[monster.leiche.details.zaehne]
text    = "Die Reißzähne sind noch immer gefletscht."
woerter = ["gebiss", "fang", "maul"]

[[monster]]
id   = "hoehlenspinne"
koerper = "spinne"
name = "eine riesige Höhlenspinne"
schluesselwoerter = ["spinne"]
raumtext = "Eine riesige Spinne lauert in ihrem Netz an der Decke."
beschreibung = "Acht schwarze Augen starren dich an. Ihre Beine sind so lang wie dein Arm."
stufe = 6
lebenspunkte = 60
mana = 20
zauber = ["feuerpfeil"]
aggressiv = true
beute = [ { gegenstand = "heiltrank", chance = 30 } ]
geld  = [50, 120]
ruestung  = 2
erholung  = 3.5
angriffe  = ["sticht", "beißt", "umschlingt"]
todestext = "*zuckt mit allen acht Beinen und rollt sich zusammen."
