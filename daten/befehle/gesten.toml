# =====================================================================
#  Gesten: eigene Befehle mit Texten
# =====================================================================
#  [[geste]]
#  woerter     = ["winke", "winken"]      # womit man sie aufruft
#  hilfe       = "Jemandem zuwinken"      # erscheint in der Hilfe
#  rolle       = "spieler"                # optional: baumeister, admin
#
#  # ohne Ziel ("winke"):
#  selbst      = "Du winkst."             # was du liest
#  andere      = "{name} winkt."          # was die anderen im Raum lesen
#
#  # mit Ziel ("winke bert" oder "winke wirt"):
#  selbst_ziel = "Du winkst {ziel_dativ} zu."
#  ziel        = "{name} winkt dir zu."   # nur, wenn das Ziel ein Spieler ist
#  andere_ziel = "{name} winkt {ziel_dativ} zu."
#
#  {name} = wer die Geste macht
#  {ziel} = Spieler- oder NPC-Name ("den Wirt"), {ziel_dativ} = "dem Wirt"
#  Lässt du die *_ziel-Texte weg, gibt es die Geste nur ohne Ziel.
# =====================================================================

[[geste]]
woerter     = ["winke", "winken"]
hilfe       = "Winken oder jemandem zuwinken"
selbst      = "Du winkst fröhlich."
andere      = "{name} winkt fröhlich."
selbst_ziel = "Du winkst {ziel_dativ} zu."
ziel        = "{name} winkt dir zu."
andere_ziel = "{name} winkt {ziel_dativ} zu."

