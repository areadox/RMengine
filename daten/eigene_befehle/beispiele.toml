# Eine Waffe führen: geht nur mit Gegenständen der Art "waffe"
[[befehl]]
id                  = "fuehren"
woerter             = ["fuehre", "fuehren"]
syntax              = "fuehre <waffe>"
hilfe               = "Eine Waffe in die Hand nehmen"
gegenstand_typen    = ["waffe"]
mit_gegenstand      = "anlegen"
ohne_gegenstand     = "Welche Waffe willst du führen?"
falscher_gegenstand = "{ding} ist keine Waffe."
selbst              = "Du nimmst {ding_akk} fest in die Hand."
andere              = "{name} nimmt {ding_akk} fest in die Hand."

# Am Dorfbrunnen Wasser trinken (bei Hunger und Durst)
[[befehl]]
id          = "schoepfen"
woerter     = ["schoepfe", "schoepfen"]
hilfe       = "Am Brunnen Wasser schöpfen und trinken"
raeume      = ["dorfplatz"]
nicht_hier  = "Hier gibt es kein Wasser zum Schöpfen."
selbst      = "Du schöpfst mit den Händen kühles Wasser aus dem Brunnen und trinkst."
andere      = "{name} schöpft Wasser aus dem Brunnen und trinkt."
trinken     = 40

# Nachts bei klarem Himmel die Sterne betrachten (nur draußen)
[[befehl]]
id           = "sterne"
woerter      = ["sterne", "sternbilder"]
hilfe        = "Nachts die Sterne betrachten (stärkt das Mana)"
nur_draussen = true
nicht_hier   = "Von hier aus siehst du den Himmel nicht."
tageszeiten  = ["nacht"]
wetter       = ["klar"]
nicht_jetzt  = "Gerade sind keine Sterne zu sehen."
abklingzeit  = 300
selbst       = "Du legst den Kopf in den Nacken und betrachtest die funkelnden Sternbilder. Eine stille Kraft erfüllt dich."
andere       = "{name} blickt versonnen zu den Sternen hinauf."
mp           = 10
