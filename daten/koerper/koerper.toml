# =====================================================================
#  Körperbau: welche Körperteile ein Wesen hat
# =====================================================================
#  Rassen und Monster verweisen darauf mit  koerper = "..."
#  (Spieler ohne Rasse-Körper bekommen [welt] koerper).
#
#  Jedes Teil kann man ansehen ("schau hand", "schau maul") – mit Text,
#  Sinnen (geruch, geraeusch, gefuehl) und Unter-Details wie bei Räumen.
#    halten  = true        kann etwas halten (Waffe, Schild, Fackel)
#    angriff = "beißt"     Monster greifen damit an; {ziel} = dich, {ziel_dativ} = dir
#    schaden = 5           Schaden dieses Angriffs (0 = normaler Schaden)
# =====================================================================

[[koerper]]
id   = "humanoid"
name = "Menschengestalt"

[[koerper.teile]]
id      = "kopf"
name    = "Kopf"
text    = "Dein Kopf – mit allem, was dazugehört."
text_andere = "{name} hat ein wachsames Gesicht."
woerter = ["gesicht"]
plaetze = ["kopf", "hals"]

[[koerper.teile]]
id      = "rumpf"
name    = "Rumpf"
text    = "Brust, Bauch und Rücken."
woerter = ["brust", "bauch", "ruecken"]
plaetze = ["koerper", "umhang", "ruecken", "guertel"]

[[koerper.teile]]
id         = "rechte_hand"
name       = "rechte Hand"
text       = "Deine rechte Hand. Mit ihr führst du meist die Waffe."
text_andere = "Die rechte Hand von {name}."
woerter    = ["haende", "rechte", "faust"]
halten     = true
plaetze    = ["haende", "ring"]
angriff    = "schlägt {ziel} mit der Faust"
angriff_du = "schlägst {ziel} mit der Faust"

[[koerper.teile]]
id         = "linke_hand"
name       = "linke Hand"
text       = "Deine linke Hand – gut für einen Schild oder eine Fackel."
text_andere = "Die linke Hand von {name}."
woerter    = ["linke"]
halten     = true
plaetze    = ["haende", "ring"]
angriff    = "verpasst {ziel_dativ} einen Haken"
angriff_du = "verpasst {ziel_dativ} einen Haken"

[[koerper.teile]]
id         = "beine"
name       = "Beine"
text       = "Zwei Beine, die dich schon weit getragen haben."
text_andere = "{name} steht fest auf beiden Beinen."
woerter    = ["bein", "fuesse", "fuss"]
plaetze    = ["beine", "fuesse"]
angriff    = "tritt nach {ziel_dativ}"
angriff_du = "trittst nach {ziel_dativ}"

