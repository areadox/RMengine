# =====================================================================
#  NPC: Schwester Alwine, Priesterin im Tempel
# =====================================================================
#  Sie lehrt Zauber und nimmt in den Orden des Lichts auf.

[npc]
id        = "priesterin"
erbt      = "vorlage_dorfbewohner"
name      = "Schwester Alwine"
akkusativ = "Schwester Alwine"
dativ     = "Schwester Alwine"
schluesselwoerter = ["alwine", "schwester", "priesterin"]
raumtext  = "Schwester Alwine kniet betend vor dem Altar."
beschreibung = """
Eine ältere Frau in einem schlichten weißen Gewand. Ihre Augen sind
freundlich, aber wach – ihr entgeht nichts."""
stufe        = 10
lebenspunkte = 120
gilde        = "lichtorden"   # nimmt in den Orden des Lichts auf (beitreten)

[npc.gespraech]
begruessung = "Das Licht sei mit dir, {spieler}."
beruf       = "Ich hüte diesen Tempel und lehre die Kunst des Schutzes und der Heilung. Frag nach meinen Lehren (waren)."
aufgabe     = "Wer dem Orden des Lichts beitreten will, sage es mir (beitreten)."
name        = "Man nennt mich Schwester Alwine."
abschied    = "Geh mit dem Licht."
unbekannt   = "*lächelt nur still."

[[npc.lehrt]]
id    = "baerenkraft"
preis = 500
stufe = 3

[[npc.lehrt]]
id    = "heilkunde"
preis = 60
bis   = 25
