# =====================================================================
#  Gegenstände
# =====================================================================
#  erbt = "vorlage_...": übernimmt alle Werte einer Vorlage aus daten/vorlagen/
#  typ:    waffe, ruestung, trank, nahrung, schluessel, werkzeug, schmuck, behaelter, sonstiges
#  platz:  waffe, schild, kopf, koerper, haende, beine, fuesse, hals, ring, umhang, licht
#          (nur nötig, wenn man den Gegenstand anlegen kann)
#  akkusativ: Name nach "Du nimmst ..." (z.B. "einen roten Apfel"); fehlt er, wird name benutzt
#  eigenschaften: frei wählbare Zahlen. "heilung" und "mana" wirken beim Benutzen.

[[gegenstand]]
id   = "apfel"
erbt = "vorlage_essen"
name = "ein roter Apfel"
akkusativ = "einen roten Apfel"
schluesselwoerter = ["apfel"]
beschreibung = "Ein knackiger, roter Apfel."
eigenschaften = { heilung = 5 }
benutzen_text = "Du beißt in den Apfel. Lecker!"

