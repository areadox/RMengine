# =====================================================================
#  Waffen und Rüstungen
# =====================================================================
#  Kampfwerte:
#    eigenschaften = { schaden = 6 }   Grundschaden einer Waffe
#    eigenschaften = { ruestung = 3 }  zieht so viel von jedem Treffer ab
#    erholung   = 2.0                  Sekunden zwischen zwei Angriffen (Waffe)
#    fertigkeit = "schwertkampf"       Fertigkeit, die benutzt und geübt wird
#  Weitere Eigenschaften mit dem Namen eines Werts (staerke, geschick ...)
#  erhöhen diesen Wert, solange man den Gegenstand trägt.

[[gegenstand]]
id   = "kurzschwert"
erbt = "vorlage_waffe"
name = "ein Kurzschwert"
schluesselwoerter = ["schwert", "kurzschwert"]
gewicht = 3
wert = 300
bodentext = "Ein Kurzschwert hängt an der Wand."
beschreibung = "Eine einfache, aber gut geschliffene Klinge."
eigenschaften = { schaden = 6, staerke = 1 }
erholung   = 2.0

[gegenstand.details]
klinge = "Die Klinge ist zweischneidig und eine knappe Elle lang. Kleine Scharten zeugen von Benutzung."
griff  = { text = "Der Griff ist mit Leder umwickelt, das sich an einer Stelle löst.", gefuehl = "Das Leder liegt gut in der Hand." }

[[gegenstand]]
id   = "holzschild"
erbt = "vorlage_ruestung"
name = "ein Holzschild"
akkusativ = "einen Holzschild"
schluesselwoerter = ["schild"]
platz = "schild"
gewicht = 4
wert = 150
beschreibung = "Ein runder Schild aus Eichenholz mit Eisenbeschlag."
eigenschaften = { ruestung = 3 }

[[gegenstand]]
id   = "lederhelm"
erbt = "vorlage_ruestung"
name = "ein Lederhelm"
akkusativ = "einen Lederhelm"
schluesselwoerter = ["helm"]
platz = "kopf"
gewicht = 1
wert = 100
bodentext = "Zwischen den Wurzeln liegt ein alter Lederhelm."
beschreibung = "Ein abgewetzter Helm aus gehärtetem Leder."
eigenschaften = { ruestung = 1 }

[[gegenstand]]
id   = "dolch"
erbt = "vorlage_waffe"
name = "ein Dolch"
akkusativ = "einen Dolch"
schluesselwoerter = ["dolch", "messer"]
gewicht = 1
wert = 120
beschreibung = "Ein schmaler Dolch. Schnell, aber nicht sehr gefährlich."
eigenschaften = { schaden = 3, geschick = 1 }
erholung   = 1.3

[[gegenstand]]
id   = "streitaxt"
erbt = "vorlage_waffe"
name = "eine schwere Streitaxt"
akkusativ = "eine schwere Streitaxt"
schluesselwoerter = ["axt", "streitaxt"]
gewicht = 6
wert = 600
beschreibung = "Eine zweischneidige Axt, so schwer, dass man sie mit beiden Händen führen muss."
eigenschaften = { schaden = 14 }
erholung   = 3.8
haende     = 2            # Zweihänder: braucht beide Hände

[[gegenstand]]
id   = "zauberstab"
erbt = "vorlage_waffe"
name = "ein Zauberstab"
akkusativ = "einen Zauberstab"
schluesselwoerter = ["stab", "zauberstab"]
beschreibung = "Ein glatter Stab aus Eschenholz mit einem trüben Kristall an der Spitze."
fertigkeit = "magie"
erholung   = 2.2
wert       = 400
# zauberstab = 1: Damit kann man einen Kampfzauber bereithalten (bereite ...)
eigenschaften = { schaden = 2, zauberstab = 1, intelligenz = 1 }
# Ein Skript am Gegenstand: Der Befehl gilt, solange man den Stab dabeihat
skript = '''
befehl{
  woerter = {"schwinge", "schwenke"},
  syntax  = "schwinge stab",
  hilfe   = "Den Zauberstab schwingen",
  funktion = function(s, rest)
    if not rest:find("stab") then return false end
    s:sende("Du schwingst den Zauberstab. Der Kristall glimmt auf und versprüht bunte Funken.")
    s:andere(s.name .. " schwingt einen Zauberstab – bunte Funken stieben durch die Luft.")
  end,
}
bei_anlegen(function(s, id, raum)
  s:sende("{grau}Ein leichtes Kribbeln läuft dir den Arm hinauf.{/}")
end)
'''
