# =====================================================================
#  Vorlagen für Gegenstände
# =====================================================================
#  Eine Vorlage (vorlage = true) erscheint nicht selbst in der Welt.
#  Andere Einträge übernehmen mit  erbt = "<id>"  alle ihre Werte und
#  geben nur noch an, was anders ist. Beispiel:
#
#    [[gegenstand]]
#    id    = "dolch"
#    erbt  = "vorlage_waffe"    # typ, platz, fertigkeit ... kommen von hier
#    name  = "ein Dolch"
#    erholung = 1.3             # überschreibt den Wert der Vorlage
#
#  Tabellen wie eigenschaften werden zusammengeführt, Listen ersetzt.
#  Auch eine Vorlage kann von einer anderen erben.
# =====================================================================

[[gegenstand]]
id         = "vorlage_waffe"
vorlage    = true
name       = "eine Waffe"
typ        = "waffe"
platz      = "waffe"
fertigkeit = "schwertkampf"
erholung   = 2.0
gewicht    = 2

[[gegenstand]]
id         = "vorlage_ruestung"
vorlage    = true
name       = "ein Rüstungsteil"
typ        = "ruestung"
gewicht    = 2

[[gegenstand]]
id      = "vorlage_trank"
vorlage = true
name    = "ein Trank"
typ     = "trank"
gewicht = 1
wert    = 250

[[gegenstand]]
id      = "vorlage_essen"
vorlage = true
name    = "etwas zu essen"
typ     = "nahrung"
gewicht = 1
wert    = 20

[[gegenstand]]
id      = "vorlage_getraenk"
vorlage = true
name    = "etwas zu trinken"
typ     = "getraenk"
gewicht = 1
wert    = 15

# ---------------------------------------------------------------------
#  Behälter: Taschen, Beutel, Rucksäcke
# ---------------------------------------------------------------------
#  fassungsvermoegen  so viel Gewicht passt hinein (0 = kein Behälter)
#  max_dinge          höchstens so viele Dinge (0 = beliebig viele)
#  gewicht_reduktion  der Inhalt wiegt so viel Prozent weniger (z.B. 50)
#  nur_typen          nur diese Typen passen hinein, z.B. ["trank"]
#  platz              "ruecken" oder "guertel", wenn man ihn anlegen kann
#  dativ              "einer bestickten Tasche" – nur nötig, wenn der Name Adjektive hat
#  Im Spiel: stecke brot in rucksack / nimm brot aus rucksack / schau rucksack

[[gegenstand]]
id      = "vorlage_behaelter"
vorlage = true
name    = "ein Behälter"
typ     = "behaelter"
gewicht = 1
fassungsvermoegen = 10

[[gegenstand]]
id      = "vorlage_rucksack"
erbt    = "vorlage_behaelter"
vorlage = true
name    = "ein Rucksack"
platz   = "ruecken"
gewicht = 2
fassungsvermoegen = 40
gewicht_reduktion = 25
