woerter = ["fensterscheibe", "scheibe", "scheiben", "fensterladen", "fensterlaeden"]
text    = """
Ein kleines Fenster mit Butzenscheiben aus dickem, grünlichem Glas. Die
Welt draußen erscheint dahinter verzerrt und wellig."""
gefuehl = "Das Glas ist kühl und uneben."

[[beschreibung]]
