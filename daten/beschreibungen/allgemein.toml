woerter = ["spinnwebe", "spinnennetz", "spinnennetze", "netz"]
text    = """
Graue Spinnweben hängen in den Ecken, schwer von Staub. In einer sitzt eine
kleine Spinne und wartet geduldig."""
gefuehl = "Die Spinnweben kleben an deinen Fingern. Igitt."
nutzt   = ["staub"]


