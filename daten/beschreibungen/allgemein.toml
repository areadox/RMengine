# =====================================================================
#  Allgemeine Beschreibungen – die "Bibliothek" der Welt
# =====================================================================
#  Hier stehen Dinge, die überall gleich aussehen: Bäume, Himmel, Steine,
#  Wasser, Mauern, Möbel ... Man schreibt sie EINMAL und benutzt sie in
#  beliebig vielen Räumen, Geländearten oder Oberwelt-Feldern:
#
#      nutzt = ["eiche", "moos", "himmel"]
#
#  Dann kann ein Spieler dort "schau eiche", "riech moos" oder
#  "taste rinde" eingeben.
#
#  Aufbau eines Eintrags:
#
#    [[beschreibung]]
#    id        = "eiche"                  # Name zum Verweisen (nutzt = [...])
#    woerter   = ["eichen", "eichbaum"]   # weitere Suchwörter (die id gilt immer)
#    text      = "..."                    # was man beim Ansehen liest
#    geruch    = "..."                    # Befehl: riech eiche
#    geraeusch = "..."                    # Befehl: hoer eiche
#    gefuehl   = "..."                    # Befehl: taste eiche
#    nutzt     = ["rinde", "laub"]        # andere Einträge, die hier mitgelten
#
#    [beschreibung.details]               # Unterdetails, beliebig tief
#    eicheln = "Kleine braune Eicheln ..."
#
#  Eigene Räume können diese Texte jederzeit übertreffen: Ein Detail mit
#  demselben Namen im Raum hat immer Vorrang vor der Bibliothek.
# =====================================================================


# ---------------------------------------------------------------------
#  HIMMEL, LUFT UND WETTER
# ---------------------------------------------------------------------

[[beschreibung]]
id      = "himmel"
woerter = ["firmament", "horizont"]
text    = """
Der Himmel wölbt sich weit über dir. Am Horizont verschwimmen Land und Luft
zu einem blassen Band, und hoch oben ziehen Wolken langsam ihre Bahn."""
nutzt   = ["wolken"]

[[beschreibung]]
id      = "wolken"
woerter = ["wolke"]
text    = """
Weiße, aufgetürmte Wolken treiben gemächlich dahin. Wenn du lange genug
hinsiehst, erkennst du in ihnen Gesichter, Tiere und Burgen, die sich
langsam auflösen und neu entstehen."""

