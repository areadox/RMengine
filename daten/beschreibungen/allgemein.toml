text    = "Schwere, dunkle Holzbalken, von Axthieben gezeichnet und vom Rauch vieler Jahre geschwärzt."
geruch  = "Das alte Holz riecht leicht nach Rauch."

[[beschreibung]]
id      = "tuer"
woerter = ["tueren", "eingang", "tuerrahmen", "klinke"]
text    = """
Eine schwere Holztür mit eisernen Beschlägen. Die Klinke ist von vielen
Händen blank poliert."""
geraeusch = "Die Angeln quietschen leise."
gefuehl   = "Das Holz ist massiv, das Eisen der Beschläge kalt."

[[beschreibung]]
