geruch    = "Es riecht nach brennendem Holz und warmem Stein."
geraeusch = "Das Feuer knistert und knackt, ab und zu stiebt ein Funkenregen auf."
gefuehl   = "Die Hitze ist angenehm auf deinem Gesicht, zu nah heran solltest du aber nicht."

[[beschreibung]]
id      = "kerze"
woerter = ["kerzen", "kerzenlicht", "docht", "wachs"]
text    = """
Kerzen aus gelblichem Wachs, die ein warmes, flackerndes Licht verbreiten.
Wachs ist an ihnen heruntergelaufen und zu kleinen Bächen erstarrt."""
geruch  = "Es riecht nach warmem Bienenwachs."
gefuehl = "Das Wachs ist warm und weich, die Flamme heiß."

[[beschreibung]]
