woerter = ["stufen", "stufe", "treppenstufen", "gelaender"]
text    = "Eine steile Holztreppe, deren Stufen in der Mitte ausgetreten sind."
geraeusch = "Jede Stufe knarrt in einem anderen Ton."

[[beschreibung]]
id      = "feuer"
woerter = ["flammen", "glut", "kamin", "feuerstelle", "herd"]
text    = """
Ein Feuer brennt in einer gemauerten Feuerstelle. Die Flammen tanzen gelb
