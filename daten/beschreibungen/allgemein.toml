woerter = ["stuehle", "hocker", "schemel", "sitz"]
text    = "Einfache Holzstühle und dreibeinige Hocker, keiner gleicht dem anderen."
geraeusch = "Ein Stuhl kratzt über den Boden."

[[beschreibung]]
