[package]
name = "rmengine"
version = "0.2.0"
edition = "2021"
description = "RMengine – ein datengetriebener MUD-Treiber: Welten werden in TOML-Dateien gebaut, nicht programmiert."
repository = "https://github.com/areadox/RMengine"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
rand = "0.8"
ureq = { version = "2", default-features = false, features = ["tls", "native-certs", "json", "proxy-from-env"] }

[profile.release]
strip = true
lto = true
codegen-units = 1

# Der grafische Welteditor liegt in editor/ (eigenes Programm: rmeditor).
# `cargo build` im Hauptordner baut weiterhin nur den Server.
[workspace]
members = [".", "editor"]
